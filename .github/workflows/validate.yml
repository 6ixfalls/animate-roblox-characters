name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit and structure tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit bundled toolchain
        run: python3 animate-roblox-characters/scripts/toolchain.py --repository-only
      - name: Run privacy audit
        run: python3 animate-roblox-characters/scripts/privacy_check.py .
